version: '3'

dotenv:
  - '{{ .ROOT_DIR }}/.env'

vars:
  VALID_ENVS: [proxmox]  # Add additional environs to extend support
  VALID_ROOTS:  # Add additional roots to cover each tofu surface
    map:
      "10": 10-cluster
      "20": 20-gitops

tasks:
  validate-env:
    internal: true
    silent: true
    cmds:
      - |
        if [[ "{{ .VALID_ENVS | has .environment }}" != "true" ]]; then
            exit 1
        fi

  validate-root:
    internal: true
    silent: true
    cmds:
      - |
        if [[ "{{ (keys .VALID_ROOTS) | has .rootModule }}" != "true" ]]; then
            exit 1
        fi

  validate:
    internal: true
    silent: true
    cmds:
      - task: validate-env
        vars:
          environment: '{{ .environment }}'
      - task: validate-root
        vars:
          rootModule: '{{ .rootModule }}'

  init-*-*:
    silent: true
    desc: Initialize the project (init-<env>-<module>)
    dir: "{{ .TASKFILE_DIR }}/{{ .ROOT_MODULE_NAME }}"
    vars:
      ENVIRONMENT: "{{ lower (index .MATCH 0) }}"
      ROOT_MODULE: "{{ lower (index .MATCH 1) }}"
      ROOT_MODULE_NAME: "{{ get .VALID_ROOTS .ROOT_MODULE }}"
      BACKEND_CONFIG: "{{ .TASKFILE_DIR }}/environments/{{ .ENVIRONMENT }}/{{ .ROOT_MODULE_NAME }}.backend"
    deps:
      - task: validate
        vars:
          environment: '{{ .ENVIRONMENT }}'
          rootModule: '{{ .ROOT_MODULE }}'
    cmds:
      - |
        tofu init \
          -backend-config={{ .BACKEND_CONFIG }} \
          -reconfigure

  plan-*-*:
    silent: true
    desc: Execute a tofu plan (plan-<env>-<module>)
    dir: "{{ .TASKFILE_DIR }}/{{ .ROOT_MODULE_NAME }}"
    vars:
      ENVIRONMENT: "{{ lower (index .MATCH 0) }}"
      ROOT_MODULE: "{{ lower (index .MATCH 1) }}"
      ROOT_MODULE_NAME: "{{ get .VALID_ROOTS .ROOT_MODULE }}"
    deps:
      - task: validate
        vars:
          environment: '{{ .ENVIRONMENT }}'
          rootModule: '{{ .ROOT_MODULE }}'
    cmds:
      - |
        tofu plan \
          -var='base_config_path={{ .TASKFILE_DIR }}/environments/base.yaml' \
          -var='override_config_path={{ .TASKFILE_DIR }}/environments/{{ .ENVIRONMENT }}/config.yaml' {{ .CLI_ARGS }}

  apply-*-*:
    silent: true
    desc: Execute a tofu plan (apply-<env>-<module>)
    dir: "{{ .TASKFILE_DIR }}/{{ .ROOT_MODULE_NAME }}"
    vars:
      ENVIRONMENT: "{{ lower (index .MATCH 0) }}"
      ROOT_MODULE: "{{ lower (index .MATCH 1) }}"
      ROOT_MODULE_NAME: "{{ get .VALID_ROOTS .ROOT_MODULE }}"
    deps:
      - task: validate
        vars:
          environment: '{{ .ENVIRONMENT }}'
          rootModule: '{{ .ROOT_MODULE }}'
    cmds:
      - |
        tofu apply \
          -var='base_config_path={{ .TASKFILE_DIR }}/environments/base.yaml' \
          -var='override_config_path={{ .TASKFILE_DIR }}/environments/{{ .ENVIRONMENT }}/config.yaml' {{ .CLI_ARGS }}

  destroy-*-*:
    silent: true
    desc: Execute a tofu plan (destroy-<env>-<module>)
    dir: "{{ .TASKFILE_DIR }}/{{ .ROOT_MODULE_NAME }}"
    vars:
      ENVIRONMENT: "{{ lower (index .MATCH 0) }}"
      ROOT_MODULE: "{{ lower (index .MATCH 1) }}"
      ROOT_MODULE_NAME: "{{ get .VALID_ROOTS .ROOT_MODULE }}"
    deps:
      - task: validate
        vars:
          environment: '{{ .ENVIRONMENT }}'
          rootModule: '{{ .ROOT_MODULE }}'
    cmds:
      - |
        tofu destroy \
          -var='base_config_path={{ .TASKFILE_DIR }}/environments/base.yaml' \
          -var='override_config_path={{ .TASKFILE_DIR }}/environments/{{ .ENVIRONMENT }}/config.yaml' {{ .CLI_ARGS }}

  export-configs:
    # Currently only exports proxmox.
    silent: true
    desc: Export kubeconfig & talosconfig
    dir: "{{ .TASKFILE_DIR }}/10-cluster"
    cmds:
      - tofu output talosconfig -raw > ~/.talos/config
      - tofu output kubeconfig -raw > ~/.kube/config

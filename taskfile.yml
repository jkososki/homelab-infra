version: '3'

dotenv:
  - '{{ .ROOT_DIR }}/.env'

vars:
  VALID_ENVS: [dev]  # Add additional environs to extend support

tasks:
  validate-env:
    internal: true
    silent: true
    cmds:
      - |
        if [[ "{{ .VALID_ENVS | has .environment }}" != "true" ]]; then
            exit 1
        fi

  init-*:
    silent: true
    desc: Initialize the project
    dir: '{{ .USER_WORKING_DIR }}'
    vars:
      ENVIRONMENT: "{{ lower (index .MATCH 0) }}"
    deps:
      - task: validate-env
        vars:
          environment: '{{ .ENVIRONMENT }}'
    cmds:
      - |
        tofu init \
          -backend-config=environments/{{ .ENVIRONMENT }}/backend \
          -reconfigure

  plan-*:
    silent: true
    desc: Execute a tofu plan
    dir: '{{ .USER_WORKING_DIR }}'
    vars:
      ENVIRONMENT: "{{ lower (index .MATCH 0) }}"
    deps:
      - task: validate-env
        vars:
          environment: '{{ .ENVIRONMENT }}'
    cmds:
      - |
        tofu plan \
          -var='base_config_path=./environments/base.yaml' \
          -var='override_config_path=./environments/{{ .ENVIRONMENT }}/config.yaml' {{ .CLI_ARGS }}

  apply-*:
    silent: true
    desc: Execute a tofu plan
    dir: '{{ .USER_WORKING_DIR }}'
    vars:
      ENVIRONMENT: "{{ lower (index .MATCH 0) }}"
    deps:
      - task: validate-env
        vars:
          environment: '{{ .ENVIRONMENT }}'
    cmds:
      - |
        tofu apply \
          -var='base_config_path=./environments/base.yaml' \
          -var='override_config_path=./environments/{{ .ENVIRONMENT }}/config.yaml' {{ .CLI_ARGS }}

  destroy-*:
    silent: true
    desc: Execute a tofu plan
    dir: '{{ .USER_WORKING_DIR }}'
    vars:
      ENVIRONMENT: "{{ lower (index .MATCH 0) }}"
    deps:
      - task: validate-env
        vars:
          environment: '{{ .ENVIRONMENT }}'
    cmds:
      - |
        tofu destroy \
          -var='base_config_path=./environments/base.yaml' \
          -var='override_config_path=./environments/{{ .ENVIRONMENT }}/config.yaml' {{ .CLI_ARGS }}

  export-configs:
    silent: true
    desc: Export kubeconfig & talosconfig
    dir: '{{ .USER_WORKING_DIR }}'
    cmds:
      - tofu output talosconfig -raw > ~/.talos/config
      - tofu output kubeconfig -raw > ~/.kube/config

# The repo where app-of-apps configuration catalog is stored
apps_repository:
  owner: jkososki
  repo: homelab-apps
  branch: main

apps_init:
  cilium:
    release_name: cilium
    version: 1.20.3
    repository: oci://quay.io/cilium/charts
    chart: cilium
    namespace: kube-system
    values:
      base: catalog/cilium/base.values.yaml
      override: catalog/cilium/env/<env>.values.yaml
  cilium_resources:
    release_name: cilium-resources
    version: 0.1.1
    repository: https://jkososki.github.io/charts
    chart: raw
    namespace: kube-system
    values:
      base: catalog/cilium/base.values.yaml
      override: catalog/cilium/env/<env>.values.yaml

cluster:
  talos_version: 1.14.3
  kubernetes_version: 1.37.1
  iso_datastore: local
  cluster_name: homelab
  gateway_ip: 192.168.144.1
  cluster_vip: 192.168.144.220
  pve_hosts:
    pve01:
      name: pve01
    pve02:
      name: pve02
    pve03:
      name: pve03
  controlplane_nodes:
    cp1:
      core_count: 2
      disk_gb: 20
      memory_mb: 4096
      node_ip: "192.168.144.221"
      pve_host: "pve01"
    cp2:
      core_count: 2
      disk_gb: 20
      memory_mb: 4096
      node_ip: "192.168.144.222"
      pve_host: "pve02"
    cp3:
      core_count: 2
      disk_gb: 20
      memory_mb: 4096
      node_ip: "192.168.144.223"
      pve_host: "pve03"
  worker_nodes:
    w1:
      core_count: 8
      disk_gb: 20
      extra_disk_gb: 500
      memory_mb: 49152
      node_ip: "192.168.144.231"
      pve_host: "pve01"
    w2:
      core_count: 8
      disk_gb: 20
      extra_disk_gb: 500
      memory_mb: 49152
      node_ip: "192.168.144.232"
      pve_host: "pve02"
    w3:
      core_count: 14
      disk_gb: 20
      extra_disk_gb: 500
      memory_mb: 49152
      node_ip: "192.168.144.233"
      pve_host: "pve03"
